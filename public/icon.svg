    <!-- Tag/Label -->
    <rect x="85" y="95" width="30" height="35" rx="3" fill="#fbbf24"/>
    <rect x="90" y="100" width="20" height="3" rx="1" fill="#3b82f6"/>
    <rect x="90" y="107" width="15" height="3" rx="1" fill="#3b82f6"/>
    <rect x="90" y="114" width="18" height="3" rx="1" fill="#3b82f6"/>
